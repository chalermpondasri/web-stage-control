  service-search:
    image: registry.gitlab.com/ucconnect.devs/community-billboard/service-api:staging
    container_name: search-api
    env_file:
      - ".env-auth.staging"
    networks:
      - billboard-network
    command: node dist/apps/search
    restart: always

  nginx-search:
    image: nginx:stable-alpine
    volumes:
      - ./nginx-search.conf:/etc/nginx/conf.d/default.conf
    container_name: search
    depends_on:
      - service-search
    networks:
      - billboard-network

  service-mq-consumer:
    image: registry.gitlab.com/ucconnect.devs/community-billboard/service-api:staging
    container_name: mq-consumer-service
