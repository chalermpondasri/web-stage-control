version: '3'
services:
  billboard-service-api:
    image: registry.gitlab.com/ucconnect.devs/community-billboard/service-api:staging
    container_name: billboard-api
    env_file:
      - ".env-service-api.staging"
    networks:
      - billboard-network
    command: node dist/apps/main
    restart: always

  nginx-auth:
    image: nginx:stable-alpine
    container_name: auth
    volumes:
      - ./nginx-auth.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - service-auth
    networks:
      - billboard-network

